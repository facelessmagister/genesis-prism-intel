<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clients — Prism Intel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary: #7C3AED;
  --color-primary-dark: #6D28D9;
  --color-accent: #A78BFA;
  --color-surface: #0F0F1A;
  --color-surface-raised: #16162A;
  --color-border: #2A2A3E;
  --color-text: #E2E8F0;
  --color-text-muted: #94A3B8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; font-size: 16px; line-height: 1.6;
  background-color: var(--color-surface); color: var(--color-text); -webkit-font-smoothing: antialiased; padding: 32px 24px; }
h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; }
.container { max-width: 880px; margin: 0 auto; }
.header { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--color-border); }
.header-icon { width: 32px; height: 32px; background: var(--color-primary); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Plus Jakarta Sans'; font-weight: 800; font-size: 14px; color: white; }
.header-title { font-size: 18px; font-weight: 700; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--color-accent); text-decoration: none;
  font-size: 13px; font-weight: 500; margin-bottom: 20px; }
h1 { font-size: 32px; margin-bottom: 8px; }
.desc { color: var(--color-text-muted); font-size: 16px; margin-bottom: 32px; }

.client-list { display: flex; flex-direction: column; gap: 16px; }
.client-row {
  display: flex; align-items: center; gap: 20px; padding: 20px 24px;
  background: var(--color-surface-raised); border: 1px solid var(--color-border); border-radius: 12px;
  text-decoration: none; color: inherit; transition: border-color 150ms ease, box-shadow 150ms ease;
}
.client-row:hover { border-color: rgba(124, 58, 237, 0.4); box-shadow: 0 4px 24px rgba(124, 58, 237, 0.06); }
.client-letter { width: 44px; height: 44px; border-radius: 12px; background: var(--color-primary);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Plus Jakarta Sans'; font-weight: 700; font-size: 18px; color: white; flex-shrink: 0; }
.client-info { flex: 1; }
.client-name { font-family: 'Plus Jakarta Sans'; font-size: 16px; font-weight: 700; margin-bottom: 2px; }
.client-tagline { font-size: 13px; color: var(--color-text-muted); }
.client-count { font-size: 12px; font-weight: 600; color: var(--color-accent); }

.footer { text-align: center; padding-top: 40px; border-top: 1px solid var(--color-border);
  color: var(--color-text-muted); font-size: 12px; margin-top: 40px; }
@media (max-width: 600px) { body { padding: 20px 16px; } }
</style>
</head>
<body>
<div class="container">
  <a class="back" href="../">← Back to Prism Intel</a>
  <div class="header">
    <div class="header-icon">PI</div>
    <span class="header-title">Prism Intel — Clients</span>
  </div>
  <h1>All Clients</h1>
  <p class="desc">Organizations under continuous competitive intelligence monitoring.</p>

  <div class="client-list">
    <a href="anthropic/" class="client-row">
      <div class="client-letter">A</div>
      <div class="client-info">
        <div class="client-name">Anthropic</div>
        <div class="client-tagline">Frontier AI — Enterprise-First Safety</div>
      </div>
      <div class="client-count">2 reports · monitoring active</div>
    </a>
  </div>

  <div class="footer">
    Prism Intel · A Genesis business ·
    <a href="https://github.com/facelessmagister" style="color: var(--color-accent);" target="_blank">github.com/facelessmagister</a>
  </div>
</div>
</body>
</html>
