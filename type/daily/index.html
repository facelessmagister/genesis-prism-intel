<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Analyses — Prism Intel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary: #7C3AED; --color-accent: #A78BFA;
  --color-surface: #0F0F1A; --color-surface-raised: #16162A;
  --color-border: #2A2A3E; --color-text: #E2E8F0; --color-text-muted: #94A3B8;
}
* { margin:0;padding:0;box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; font-size:16px; line-height:1.6; background:var(--color-surface); color:var(--color-text); -webkit-font-smoothing:antialiased; padding:32px 24px; }
h1,h2 { font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; }
.container { max-width:880px; margin:0 auto; }
.header { display:flex; align-items:center; gap:10px; margin-bottom:32px; padding-bottom:20px; border-bottom:1px solid var(--color-border); }
.header-icon { width:32px; height:32px; background:var(--color-primary); border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans'; font-weight:800; font-size:14px; color:white; }
.header-title { font-size:18px; font-weight:700; }
.back { display:inline-flex; align-items:center; gap:6px; color:var(--color-accent); text-decoration:none; font-size:13px; font-weight:500; margin-bottom:20px; }
h1 { font-size:28px; margin-bottom:8px; }
.desc { color:var(--color-text-muted); font-size:15px; margin-bottom:32px; }
.count { font-size:13px; color:var(--color-text-muted); margin-bottom:24px; }

.report-list { display:flex; flex-direction:column; gap:10px; }
.report-item {
  display:flex; align-items:center; gap:16px; padding:14px 18px;
  background:var(--color-surface-raised); border:1px solid var(--color-border); border-radius:10px;
  text-decoration:none; color:inherit; transition:border-color 150ms ease; flex-wrap:wrap;
}
.report-item:hover { border-color:rgba(124,58,237,0.4); }
.report-date { font-size:12px; font-weight:600; color:var(--color-text-muted); min-width:90px; }
.report-client { font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px; text-transform:uppercase; letter-spacing:0.04em; flex-shrink:0; }
.report-client.anthropic { background:rgba(124,58,237,0.1); color:var(--color-accent); }
.report-client.maybank { background:rgba(253,224,71,0.1); color:#FDE047; }
.report-client.nvidia { background:rgba(118,185,0,0.1); color:#76B900; }
.report-title { font-size:14px; font-weight:500; flex:1; }

.empty-state { text-align:center; padding:40px 20px; border:1px dashed var(--color-border); border-radius:12px; color:var(--color-text-muted); font-size:14px; }
.footer { text-align:center; padding-top:40px; border-top:1px solid var(--color-border); color:var(--color-text-muted); font-size:12px; margin-top:40px; }
</style>
</head>
<body>
<div class="container">
  <a class="back" href="../">← All Types</a>
  <div class="header">
    <div class="header-icon">PI</div>
    <span class="header-title">Prism Intel — Type Hub</span>
  </div>

  <h1>Daily Analyses</h1>
  <p class="desc">Day-to-day signal tracking: newsroom scans, competitor moves, and threat detection with immediate commentary.</p>
  <p class="count">0 available across all clients</p>

  <div class="report-list">
    <div class="empty-state">No reports yet in this category.</div>
  </div>

  <div class="footer">
    Prism Intel · A Genesis business ·
    <a href="https://github.com/facelessmagister" style="color:var(--color-accent);" target="_blank">github.com/facelessmagister</a>
  </div>
</div>
</body>
</html>
